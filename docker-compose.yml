version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-ab
    restart: unless-stopped
    ports:
      - "8100:80"
    volumes:
      - ./:/var/www/html
      - ab_storage:/var/www/html/storage/app
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - db
    networks:
      - lpkia_network

  db:
    image: mysql:5.7
    container_name: adminbisnis_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: administrasibisnis
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: adminbisnis_user
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - lpkia_network

volumes:
  dbdata:
  ab_storage:

networks:
  lpkia_network:
    external: true
